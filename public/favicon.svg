<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Nền bo góc biểu tượng công nghệ y tế chuẩn quốc tế -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />

  <!-- Biểu tượng Chữ Thập Y Khoa (Medical Cross) -->
  <rect x="26" y="13" width="12" height="38" rx="4" fill="url(#crossGrad)" />
  <rect x="13" y="26" width="38" height="12" rx="4" fill="url(#crossGrad)" />

  <!-- Đường nhịp tim điện tâm đồ ECG / Công nghệ số (Pulse Line) -->
  <path d="M16 32h7l2.5-5 4 10 3.5-8 2.5 3h7" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Điểm nhấn lõi thông minh / AI Audit -->
  <circle cx="48" cy="16" r="3.5" fill="#38bdf8" />
</svg>
